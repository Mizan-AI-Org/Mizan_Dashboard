<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .grid { stroke: #eef2f7; stroke-width: 1; }
      .title { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji"; font-weight: 800; fill: #0f172a; letter-spacing: 1.5px; }
      .subtitle { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-weight: 600; fill: #475569; }
      .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-weight: 700; fill: #0f172a; }
      .small { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-weight: 600; fill: #334155; }
      .tiny { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-weight: 600; fill: #64748b; }
      .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 18; ry: 18; }
      .box-soft { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 2; rx: 18; ry: 18; }
      .box-emerald { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 2; rx: 18; ry: 18; }
      .pill { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 14; ry: 14; }
      .pill-dark { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 2; rx: 14; ry: 14; }
      .pill-emerald { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 2; rx: 14; ry: 14; }
      .shadow { filter: drop-shadow(0 10px 22px rgba(15, 23, 42, 0.10)); }
      .arrow { stroke: #10b981; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .arrow-muted { stroke: #94a3b8; stroke-width: 3; fill: none; marker-end: url(#arrowHeadMuted); }
      .line { stroke: #cbd5e1; stroke-width: 2; fill: none; }
    </style>

    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#10b981"/>
    </marker>
    <marker id="arrowHeadMuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <!-- Subtle grid -->
  <g opacity="0.7">
    <path class="grid" d="M0 120 H1600"/>
    <path class="grid" d="M0 240 H1600"/>
    <path class="grid" d="M0 360 H1600"/>
    <path class="grid" d="M0 480 H1600"/>
    <path class="grid" d="M0 600 H1600"/>
    <path class="grid" d="M0 720 H1600"/>
    <path class="grid" d="M0 840 H1600"/>
    <path class="grid" d="M160 0 V900"/>
    <path class="grid" d="M320 0 V900"/>
    <path class="grid" d="M480 0 V900"/>
    <path class="grid" d="M640 0 V900"/>
    <path class="grid" d="M800 0 V900"/>
    <path class="grid" d="M960 0 V900"/>
    <path class="grid" d="M1120 0 V900"/>
    <path class="grid" d="M1280 0 V900"/>
    <path class="grid" d="M1440 0 V900"/>
  </g>

  <!-- Header -->
  <g transform="translate(70,48)">
    <!-- Mizan mark -->
    <g transform="translate(0,6)">
      <circle cx="16" cy="16" r="16" fill="#10b981" opacity="0.14"/>
      <circle cx="16" cy="16" r="9" fill="none" stroke="#10b981" stroke-width="4"/>
      <circle cx="22.5" cy="16" r="2.5" fill="#10b981"/>
    </g>
    <text class="title" x="46" y="28" font-size="22">TECHNOLOGY &amp; INTEGRATIONS</text>
    <text class="subtitle" x="46" y="56" font-size="14">Comprehensive system architecture (clients - edge - platform - AI/data - integrations)</text>
  </g>

  <!-- Left: Clients -->
  <g class="shadow" transform="translate(70,160)">
    <rect class="box" x="0" y="0" width="300" height="300"/>
    <text class="label" x="20" y="38" font-size="14">Clients</text>

    <rect class="pill" x="20" y="64" width="260" height="62"/>
    <text class="small" x="86" y="98" font-size="13">Manager Web App</text>
    <rect x="34" y="80" width="36" height="26" rx="6" fill="#0f172a" opacity="0.08" stroke="#cbd5e1"/>
    <rect x="40" y="86" width="24" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1"/>

    <rect class="pill" x="20" y="136" width="260" height="62"/>
    <text class="small" x="86" y="170" font-size="13">Admin Dashboard</text>
    <rect x="34" y="152" width="36" height="26" rx="6" fill="#0f172a" opacity="0.08" stroke="#cbd5e1"/>
    <rect x="40" y="158" width="24" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1"/>

    <rect class="pill" x="20" y="208" width="260" height="62"/>
    <text class="small" x="86" y="242" font-size="13">Mobile</text>
    <rect x="40" y="220" width="26" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="53" cy="252" r="2" fill="#94a3b8"/>
  </g>

  <!-- Top: Edge -->
  <g class="shadow" transform="translate(420,160)">
    <rect class="box-soft" x="0" y="0" width="760" height="120"/>
    <text class="label" x="20" y="38" font-size="14">Edge</text>

    <rect class="pill-dark" x="20" y="54" width="300" height="48"/>
    <text class="small" x="64" y="84" font-size="13">CDN / WAF</text>
    <path d="M40 78 h16" stroke="#10b981" stroke-width="3" opacity="0.9"/>

    <rect class="pill-dark" x="340" y="54" width="400" height="48"/>
    <text class="small" x="384" y="84" font-size="13">Load Balancer</text>
    <path d="M360 78 h16" stroke="#10b981" stroke-width="3" opacity="0.9"/>
  </g>

  <!-- Center: Platform -->
  <g class="shadow" transform="translate(420,310)">
    <rect class="box" x="0" y="0" width="760" height="360"/>
    <text class="label" x="20" y="38" font-size="14">Mizan Cloud Platform</text>
    <text class="tiny" x="20" y="62" font-size="12">Core operational modules and orchestration</text>

    <!-- Core modules grid -->
    <g transform="translate(20,88)">
      <rect class="pill-emerald" x="0" y="0" width="220" height="56"/>
      <text class="small" x="16" y="34" font-size="13">API Gateway</text>

      <rect class="pill-emerald" x="240" y="0" width="220" height="56"/>
      <text class="small" x="256" y="34" font-size="13">Auth &amp; RBAC</text>

      <rect class="pill-emerald" x="480" y="0" width="240" height="56"/>
      <text class="small" x="496" y="34" font-size="13">Integration Hub</text>
      <text class="tiny" x="496" y="50" font-size="11">Webhooks " Connectors</text>

      <rect class="pill" x="0" y="76" width="220" height="56"/>
      <text class="small" x="16" y="110" font-size="13">Scheduling Engine</text>

      <rect class="pill" x="240" y="76" width="220" height="56"/>
      <text class="small" x="256" y="110" font-size="13">Tasks &amp; Checklists</text>

      <rect class="pill" x="480" y="76" width="240" height="56"/>
      <text class="small" x="496" y="110" font-size="13">Incident Management</text>

      <rect class="pill" x="0" y="152" width="220" height="56"/>
      <text class="small" x="16" y="186" font-size="13">Reporting &amp; Analytics</text>

      <rect class="pill" x="240" y="152" width="220" height="56"/>
      <text class="small" x="256" y="186" font-size="13">Notification Service</text>
      <text class="tiny" x="256" y="202" font-size="11">Email " Push " WhatsApp</text>

      <rect class="pill" x="480" y="152" width="240" height="56"/>
      <text class="small" x="496" y="186" font-size="13">Background Jobs / Queue</text>
      <text class="tiny" x="496" y="202" font-size="11">Workers " Retries</text>
    </g>
  </g>

  <!-- AI Layer (right of platform) -->
  <g class="shadow" transform="translate(1210,310)">
    <rect class="box-emerald" x="0" y="0" width="320" height="220"/>
    <text class="label" x="20" y="38" font-size="14">AI Layer</text>
    <text class="tiny" x="20" y="62" font-size="12">Assistants " Optimisation " Insights</text>

    <rect class="pill-emerald" x="20" y="80" width="280" height="46"/>
    <text class="small" x="36" y="108" font-size="13">LLM Orchestrator</text>

    <rect class="pill-emerald" x="20" y="134" width="280" height="46"/>
    <text class="small" x="36" y="162" font-size="13">Rules &amp; Constraints</text>

    <rect class="pill-emerald" x="20" y="188" width="280" height="46"/>
    <text class="small" x="36" y="216" font-size="13">Prompt &amp; Audit Logs</text>
  </g>

  <!-- Data Layer -->
  <g class="shadow" transform="translate(420,690)">
    <rect class="box-soft" x="0" y="0" width="760" height="150"/>
    <text class="label" x="20" y="38" font-size="14">Data Layer</text>
    <text class="tiny" x="20" y="62" font-size="12">Operational data + fast access + files</text>

    <rect class="pill-dark" x="20" y="80" width="230" height="54"/>
    <text class="small" x="36" y="112" font-size="13">PostgreSQL</text>
    <text class="tiny" x="36" y="130" font-size="11">Source of truth</text>

    <rect class="pill-dark" x="270" y="80" width="230" height="54"/>
    <text class="small" x="286" y="112" font-size="13">Redis Cache</text>
    <text class="tiny" x="286" y="130" font-size="11">Sessions " hot data</text>

    <rect class="pill-dark" x="520" y="80" width="220" height="54"/>
    <text class="small" x="536" y="112" font-size="13">Object Storage</text>
    <text class="tiny" x="536" y="130" font-size="11">Files " exports</text>
  </g>

  <!-- Right: External Integrations -->
  <g class="shadow" transform="translate(1210,550)">
    <rect class="box" x="0" y="0" width="320" height="290"/>
    <text class="label" x="20" y="38" font-size="14">External Integrations</text>
    <text class="tiny" x="20" y="62" font-size="12">Connected via Integration Hub</text>

    <rect class="pill" x="20" y="80" width="280" height="44"/>
    <text class="small" x="36" y="108" font-size="13">POS</text>

    <rect class="pill" x="20" y="132" width="280" height="44"/>
    <text class="small" x="36" y="160" font-size="13">Reservations</text>

    <rect class="pill" x="20" y="184" width="280" height="44"/>
    <text class="small" x="36" y="212" font-size="13">Payroll</text>

    <rect class="pill" x="20" y="236" width="280" height="44"/>
    <text class="small" x="36" y="264" font-size="13">Inventory</text>
  </g>

  <!-- Bottom-right: Observability -->
  <g class="shadow" transform="translate(70,510)">
    <rect class="box-soft" x="0" y="0" width="300" height="330"/>
    <text class="label" x="20" y="38" font-size="14">Observability</text>
    <text class="tiny" x="20" y="62" font-size="12">Operate reliably at scale</text>

    <rect class="pill-dark" x="20" y="90" width="260" height="54"/>
    <text class="small" x="36" y="122" font-size="13">Monitoring</text>

    <rect class="pill-dark" x="20" y="154" width="260" height="54"/>
    <text class="small" x="36" y="186" font-size="13">Logging</text>

    <rect class="pill-dark" x="20" y="218" width="260" height="54"/>
    <text class="small" x="36" y="250" font-size="13">Tracing</text>

    <rect class="pill-dark" x="20" y="282" width="260" height="54"/>
    <text class="small" x="36" y="314" font-size="13">Security &amp; Audit</text>
  </g>

  <!-- Arrows / connections -->
  <!-- Clients -> Edge -->
  <path class="arrow" d="M370 260 C405 260, 405 220, 420 220"/>
  <!-- Edge -> Platform -->
  <path class="arrow" d="M800 280 C800 300, 800 300, 800 310"/>
  <!-- Platform -> Data -->
  <path class="arrow-muted" d="M800 670 C800 685, 800 685, 800 690"/>
  <!-- Platform -> AI -->
  <path class="arrow" d="M1180 430 C1200 430, 1200 420, 1210 420"/>
  <!-- AI -> Platform (feedback) -->
  <path class="arrow-muted" d="M1210 462 C1200 462, 1200 470, 1180 470"/>
  <!-- Platform -> Integrations (via hub) -->
  <path class="arrow" d="M1180 520 C1200 520, 1200 590, 1210 620"/>
  <!-- Observability -> Platform -->
  <path class="arrow-muted" d="M370 680 C405 680, 410 540, 420 520"/>

  <!-- Small legend -->
  <g transform="translate(70,860)">
    <rect x="0" y="-28" width="1460" height="38" rx="14" fill="#ffffff" opacity="0.9" stroke="#e2e8f0"/>
    <circle cx="18" cy="-9" r="6" fill="#10b981"/>
    <text class="tiny" x="32" y="-5" font-size="12">Primary flows</text>
    <circle cx="160" cy="-9" r="6" fill="#94a3b8"/>
    <text class="tiny" x="174" y="-5" font-size="12">Data/ops flows</text>
    <text class="tiny" x="1320" y="-5" font-size="12">Mizan.ai</text>
  </g>
</svg>
